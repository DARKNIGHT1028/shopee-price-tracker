<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 300px;
        padding: 16px;
        font-family: Arial, sans-serif;
      }
      h3 {
        margin-top: 0;
        color: #333;
      }
      label {
        font-size: 12px;
        color: #555;
        display: block;
        margin-bottom: 4px;
      }
      select {
        width: 100%;
        padding: 8px;
        margin-bottom: 12px;
        border-radius: 4px;
        border: 1px solid #ccc;
        font-size: 13px;
      }
      button {
        width: 100%;
        padding: 10px;
        background: #ee4d2d;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
      }
      button:hover {
        background: #d73211;
      }
      button:disabled {
        background: #ccc;
      }
      #status {
        margin-top: 12px;
        font-size: 12px;
        color: #666;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h3>Shopee MY Exporter</h3>

    <label for="sortOption">Organize data by:</label>
    <select id="sortOption">
      <option value="default">Default (Shopee's order)</option>
      <option value="priceLow">Price: Low to High</option>
      <option value="priceHigh">Price: High to Low</option>
      <option value="sold">Most Sold</option>
    </select>

    <button id="exportBtn">Extract & Export to Excel</button>
    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
